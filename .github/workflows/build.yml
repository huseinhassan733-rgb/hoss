name: HOSS Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Package installable web build
        run: cd dist && zip -r ../hoss-web-build.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: hoss-web-build
          path: hoss-web-build.zip